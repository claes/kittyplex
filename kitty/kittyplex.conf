# Copy this file and all kitty/kittyplex*.py files into your kitty config directory, then add:
#   include kittyplex.conf
# Change ctrl+shift+m on the entry, literal-chord and help bindings to customize.
# Shortcuts activate only in the kitty window that registered this socket.
map --when-focus-on var:kittyplex_socket --new-mode kittyplex --on-action end --on-unknown end ctrl+shift+m

map --mode kittyplex c kitten kittyplex.py new
map --mode kittyplex t kitten kittyplex.py new
map --mode kittyplex v kitten kittyplex.py split right
map --mode kittyplex h kitten kittyplex.py split below
map --mode kittyplex w close_window
map --mode kittyplex d kitten kittyplex.py detach
map --mode kittyplex ? kitten kittyplex.py help ctrl+shift+m
map --mode kittyplex n kitten kittyplex.py next
map --mode kittyplex p kitten kittyplex.py previous
map --mode kittyplex 1 kitten kittyplex.py select 1
map --mode kittyplex 2 kitten kittyplex.py select 2
map --mode kittyplex 3 kitten kittyplex.py select 3
map --mode kittyplex 4 kitten kittyplex.py select 4
map --mode kittyplex 5 kitten kittyplex.py select 5
map --mode kittyplex 6 kitten kittyplex.py select 6
map --mode kittyplex 7 kitten kittyplex.py select 7
map --mode kittyplex 8 kitten kittyplex.py select 8
map --mode kittyplex 9 kitten kittyplex.py select 9
map --mode kittyplex q kitten kittyplex.py quit
map --mode kittyplex escape pop_keyboard_mode
map --mode kittyplex ctrl+shift+m send_key ctrl+shift+m

# The callback grants only bounded carrier/probe messages from their source terminal.
allow_remote_control password
remote_control_password "" kittyplex_auth.py

# Optional desktop actions: bind these aliases to shortcuts of your choice.
action_alias kittyplex-local kitten kittyplex_launch.py start
action_alias kittyplex-run0 kitten kittyplex_launch.py run0
action_alias kittyplex-ssh kitten kittyplex_launch.py ssh
