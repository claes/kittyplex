# Copy this file and all kitty/termlab*.py files into your kitty config directory, then add:
#   include termlab.conf
# Change ctrl+shift+m on BOTH the entry and literal-chord bindings to customize.
# Shortcuts activate only in the kitty window that registered this socket.
map --when-focus-on var:termlab_socket --new-mode termlab --on-action end --on-unknown end ctrl+shift+m

map --mode termlab c kitten termlab.py new
map --mode termlab n kitten termlab.py next
map --mode termlab p kitten termlab.py previous
map --mode termlab 1 kitten termlab.py select 1
map --mode termlab 2 kitten termlab.py select 2
map --mode termlab 3 kitten termlab.py select 3
map --mode termlab 4 kitten termlab.py select 4
map --mode termlab 5 kitten termlab.py select 5
map --mode termlab 6 kitten termlab.py select 6
map --mode termlab 7 kitten termlab.py select 7
map --mode termlab 8 kitten termlab.py select 8
map --mode termlab 9 kitten termlab.py select 9
map --mode termlab q kitten termlab.py quit
map --mode termlab escape pop_keyboard_mode
map --mode termlab ctrl+shift+m send_key ctrl+shift+m

# The callback grants only bounded carrier messages from their source terminal.
allow_remote_control password
remote_control_password "" termlab_auth.py
